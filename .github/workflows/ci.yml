name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build + API tests
    runs-on: ubuntu-latest

    # Runs inside Debian trixie, not on the ubuntu-latest image, because this
    # code needs libpqxx >= 7.10 for the two-argument txn.exec(sql, params).
    # Ubuntu 24.04 ships 7.8, which has pqxx::params but not that overload, and
    # Debian bookworm ships 6.4, which has neither. trixie ships 7.10 — the same
    # base backend/Dockerfile uses, so CI builds what actually gets deployed.
    container: debian:trixie-slim

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billsplitter
          POSTGRES_PASSWORD: billsplitter
          POSTGRES_DB: postgres
        # No port mapping: from inside a job container the service is reached
        # by its label on the Docker network, as postgres:5432.
        # Without a health check the job races the database and fails
        # intermittently, which is worse than failing consistently.
        options: >-
          --health-cmd "pg_isready -U billsplitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      # A job container is bare: build-essential (make), git for FetchContent,
      # python3 for the API suite and curl for the health poll all have to be
      # installed explicitly. The ubuntu-latest image preinstalls them, which is
      # exactly the difference that made this job fail obscurely.
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake git ca-certificates curl python3 \
            libpqxx-dev libpq-dev libssl-dev libcurl4-openssl-dev \
            libasio-dev postgresql-client pkg-config \
            libtesseract-dev libleptonica-dev tesseract-ocr-eng

      - name: Record the libpqxx version actually in use
        run: pkg-config --modversion libpqxx

      # Crow and nlohmann/json come from FetchContent; caching the whole build
      # tree keeps the dependency clone out of every run.
      - name: Cache CMake build
        uses: actions/cache@v4
        with:
          path: backend/build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('backend/CMakeLists.txt') }}

      - name: Configure
        run: cmake -S backend -B backend/build -DCMAKE_BUILD_TYPE=Debug

      # Redirected, not piped: `cmake --build ... | tee` reports tee's exit
      # status, and the default shell has no pipefail — so a failed build
      # passed this step and surfaced later as a missing unit-test binary.
      - name: Build
        run: |
          cmake --build backend/build -j"$(nproc)" > build.log 2>&1 \
            || { echo "::error::build failed"; cat build.log; exit 1; }

      # Warnings are how the small mistakes in this codebase have surfaced, so
      # they fail the build rather than scrolling past.
      # Judges first-party code only. Crow's vendored headers emit
      # -Wtype-limits under GCC and we do not control them.
      - name: Fail on compiler warnings
        run: |
          if grep -E "warning:" build.log | grep -vE "/build/_deps/" | grep . ; then
            echo "::error::build produced warnings in first-party code"
            exit 1
          fi

      - name: C++ unit tests
        run: ./backend/build/unit-tests

      - name: API integration tests
        env:
          # Service containers are addressed by label from inside a job container.
          BILLSPLITTER_ADMIN_URL: postgresql://billsplitter:billsplitter@postgres:5432/postgres
        run: ./scripts/run-api-tests.sh

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  migrations:
    name: Migrations apply from zero
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: billsplitter
          POSTGRES_PASSWORD: billsplitter
          POSTGRES_DB: billsplitter
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U billsplitter"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client
      # Applying twice proves the ledger actually skips what it has already
      # run, which is the property that stops a re-run corrupting a database.
      - name: Apply, then re-apply
        env:
          DATABASE_URL: postgresql://billsplitter:billsplitter@localhost:5433/billsplitter
        run: |
          ./scripts/migrate.sh
          ./scripts/migrate.sh | tee second.log
          grep -q "already up to date" second.log || {
            echo "::error::migrations re-ran on a second invocation"; exit 1; }
